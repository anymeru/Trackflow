services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackconnect
      POSTGRES_PASSWORD: trackconnect
      POSTGRES_DB: track_connect
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackconnect -d track_connect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ""
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "noreply@trace-logistics.com"
      ADMIN_PHONE: "+237 XXX XXX XXX"
      ADMIN_TELEGRAM: "+237 XXX XXX XXX"
      NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"
      OSRM_BASE_URL: "https://router.project-osrm.org"
      AVERAGE_SPEED_KMH: "60"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: "http://localhost:3001/api"
      VITE_SOCKET_URL: "http://localhost:3001"

volumes:
  pgdata:
