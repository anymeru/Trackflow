services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackconnect
      POSTGRES_PASSWORD: trackconnect
      POSTGRES_DB: track_connect
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackconnect -d track_connect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://trackconnect:trackconnect@db:5432/track_connect?schema=public"
      JWT_SECRET: "tc-prod-jwt-secret-replace-with-random-64-char-string"
      PORT: "3001"
      SMTP_HOST: "smtp-relay.brevo.com"
      SMTP_PORT: "587"
      SMTP_USER: "b36f9a001@smtp-brevo.com"
      SMTP_PASS: "xsmtpsib-9c7048a77553ca7acbac42585eca5684fec20bfa3863b79e0d17679cbc259fb2-yIL1r0hwHmjVedZJ"
      SMTP_FROM: "noreply@trace-logistics.com"
      ADMIN_PHONE: "+237 XXX XXX XXX"
      ADMIN_TELEGRAM: "+237 XXX XXX XXX"
      NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"
      OSRM_BASE_URL: "https://router.project-osrm.org"
      AVERAGE_SPEED_KMH: "60"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: "http://localhost:3001/api"
      VITE_SOCKET_URL: "http://localhost:3001"

volumes:
  pgdata:
