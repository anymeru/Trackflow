services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackconnect
      POSTGRES_PASSWORD: trackconnect
      POSTGRES_DB: track_connect
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackconnect -d track_connect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://trackconnect:trackconnect@db:5432/track_connect?schema=public"
      JWT_SECRET: "docker-secret-change-in-production"
      PORT: "3001"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "track-connect@example.com"
      ADMIN_PHONE: "+237 XXX XXX XXX"
      ADMIN_TELEGRAM: "+237 XXX XXX XXX"
      NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"
      OSRM_BASE_URL: "https://router.project-osrm.org"
      AVERAGE_SPEED_KMH: "60"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: "http://localhost:3001/api"
      VITE_SOCKET_URL: "http://localhost:3001"

volumes:
  pgdata:
