<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#121212"/>

  <!-- Logo Mark -->
  <g transform="translate(400, 140)">
    <!-- T vertical stem -->
    <rect x="-16" y="-60" width="32" height="120" rx="2" fill="#f5f5f5"/>
    <!-- T crossbar -->
    <rect x="-72" y="-60" width="110" height="32" rx="2" fill="#f5f5f5"/>

    <!-- Route cutout in vertical stem (negative space) -->
    <path d="M -10,-20 Q 10,-10 10,15 Q 10,28 -5,35" stroke="#121212" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Tracking signal line entering from left -->
    <path d="M -72,-44 Q -50,-44 -40,-44" stroke="#00b4d8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Signal path through the T -->
    <path d="M -40,-44 Q -20,-44 -14,-25" stroke="#00b4d8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Route line going down -->
    <path d="M 14,22 Q 25,35 40,40 Q 55,45 70,42" stroke="#00b4d8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="none"/>

    <!-- Route waypoint dots -->
    <circle cx="25" cy="36" r="3" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="55" cy="44" r="3" fill="#4ecdc4" opacity="0.7"/>

    <!-- Location pin (tracking dot) -->
    <circle cx="78" cy="42" r="6" fill="#ff6b6b"/>
    <circle cx="78" cy="42" r="2.5" fill="#f5f5f5"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="260" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" letter-spacing="18" fill="#f5f5f5">TRACE</text>

  <!-- Subtitle -->
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="8" fill="#6b7280">ENTERPRISE TRACKING</text>

  <!-- Horizontal rule -->
  <line x1="300" y1="330" x2="500" y2="330" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Tagline -->
  <text x="400" y="358" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="4" fill="#6b7280">EVERYTHING IN VIEW.</text>
</svg>